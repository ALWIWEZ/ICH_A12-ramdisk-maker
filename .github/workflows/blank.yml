name: Build ICH Bootchain

on:
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub page

jobs:
  build:
    runs-on: macos-latest # Use the latest macOS runner (Sequoia or newer)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'Pa7r0n/ICH_A12_plus_Ramdisk' # Pull the source code of the ICH project
          path: 'ICH_A12_plus_Ramdisk'

      - name: Set up Homebrew and dependencies
        run: |
          # Ensure Homebrew is in PATH
          eval "$(/opt/homebrew/bin/brew shellenv)"
          # Install required dependencies
          brew install python@3 curl blacktop/tap/ipsw
          pip3 install -r ICH_A12_plus_Ramdisk/requirements.txt

      - name: Make scripts executable
        run: |
          chmod +x ICH_A12_plus_Ramdisk/build.sh
          chmod +x ICH_A12_plus_Ramdisk/setup.sh

      - name: Run build script with iOS 27 patch
        working-directory: ./ICH_A12_plus_Ramdisk
        run: |
          # Added --kpf-set ios27 here
          ./build.sh --kpf-set ios27

      - name: Upload bootchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: ich-bootchain
          path: ICH_A12_plus_Ramdisk/artifact/bootchain/
          if-no-files-found: error # Report an error if the folder is missing to avoid downloading empty packages
